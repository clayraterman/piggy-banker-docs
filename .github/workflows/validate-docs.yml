name: Validate documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate Mintlify configuration and MDX
        run: npm exec --yes --package=mint@4.2.883 -- mint validate
      - name: Check links, anchors, and redirects
        run: npm exec --yes --package=mint@4.2.883 -- mint broken-links --check-anchors --check-redirects
